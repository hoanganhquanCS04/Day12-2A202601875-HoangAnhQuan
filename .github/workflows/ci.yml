name: CI

# Chạy cả khi mở pull request, không chỉ khi push: bắt lỗi TRƯỚC khi vào
# nhánh chính mới là phần giá trị nhất của CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp thì hủy lần chạy cũ, khỏi tốn runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Chạy checkpoint trên một máy sạch
  # ────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy CP1–CP4
        # Loại test_cp5.py (gọi vào bản deploy đang sống → luôn đỏ trong CI)
        # và test_bonus_cicd.py (kiểm tra badge của chính workflow này → vòng lặp).
        # -m "not docker" bỏ qua test build image, job `build` bên dưới lo việc đó.
        env:
          # Máy CI không có .env — đây chính là lợi ích của 12-Factor ở CP1:
          # cùng một code, khác môi trường thì chỉ khác biến môi trường.
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
          LOG_LEVEL: INFO
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  # ────────────────────────────────────────────────────────────
  # 2. Build image trên máy sạch — bắt lỗi "file này chỉ có ở máy tôi"
  # ────────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Kiểm tra dung lượng image (< 500MB)
        run: |
          docker images day12-agent:${{ github.sha }} --format '{{.Size}}'
          docker image inspect day12-agent:${{ github.sha }} \
            --format '{{.Size}}' | awk '{
              mb = $1 / 1024 / 1024
              printf "Image size: %.1f MB\n", mb
              if (mb > 500) { print "Image quá lớn"; exit 1 }
            }'

  # ────────────────────────────────────────────────────────────
  # 3. Deploy — chỉ khi test VÀ build đều xanh, và chỉ từ nhánh main
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy lên Railway
    runs-on: ubuntu-latest
    # needs: xâu các job thành dây chuyền. Thiếu dòng này thì GitHub chạy
    # deploy SONG SONG với test, và code hỏng vẫn lên production.
    needs: [test, build]
    # if: không có nó thì mỗi lần ai đó mở pull request là một lần deploy.
    # Điều kiện `vars.PUBLIC_URL != ''` để job tự bỏ qua khi chưa cấu hình
    # deploy target — chưa deploy thì workflow vẫn xanh, không đỏ oan.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.PUBLIC_URL != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        # Token nằm trong Settings → Secrets and variables → Actions.
        # Dán thẳng vào file này = token nằm trong lịch sử git vĩnh viễn.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'day12-agent' }} --ci

      - name: Smoke test bản vừa deploy
        # "Lệnh deploy chạy xong" ≠ "service còn sống". curl -f trả mã lỗi khi
        # HTTP không phải 2xx → job đỏ → biết ngay thay vì biết từ người dùng.
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/health"
          curl -fsS "${{ vars.PUBLIC_URL }}/ready"
