# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy: agent + redis (+ nginx làm load balancer)
#
#   docker compose up -d                    # 1 agent, gọi qua localhost:8000
#   docker compose up -d --scale agent=3    # 3 agent, gọi qua localhost:80 (nginx)
#
# Secret KHÔNG nằm trong file này: `${AGENT_API_KEY}` được compose nội suy từ
# file .env cùng thư mục (.env đã nằm trong .gitignore).
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    # Dải cổng thay vì "8000:8000" để `--scale agent=3` không đụng cổng:
    # 1 instance → localhost:8000, thêm instance → 8001, 8002.
    ports:
      - "8000-8002:8000"
    environment:
      # Nội suy từ .env — không bao giờ viết thẳng giá trị khóa vào đây
      AGENT_API_KEY: ${AGENT_API_KEY}
      # `redis` là tên service, và trong compose tên service chính là hostname.
      # Dùng localhost ở đây là trỏ vào chính container agent, không phải Redis.
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Điểm cộng CP4 — load balancer round-robin trước cụm agent.
  # Docker DNS trả về cả N IP cho hostname `agent`; nginx lần lượt gửi request
  # tới từng IP. Chính vì vậy app phải stateless (state nằm ở Redis).
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  redis-data:
